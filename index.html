<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SitePreview Snapshot Diagnostic v5</title>
</head>
<body>
  <h1>SitePreview Snapshot Diagnostic v5</h1>
  <pre id="results"></pre>

  <script>
    const webhook =
      "https://webhook.site/b8808c81-3dc6-4355-b282-f10b6d73f792";

    function report(event, value) {
      const params = new URLSearchParams({
        event,
        value: String(value),
        time: new Date().toISOString()
      });

      document.getElementById("results").textContent +=
        event + ": " + value + "\n";

      fetch(webhook + "?" + params.toString(), {
        mode: "no-cors",
        credentials: "omit",
        keepalive: true
      }).catch(() => {});
    }

    report("v5-started", location.href);
    report("v5-user-agent", navigator.userAgent);
    report("v5-webdriver", navigator.webdriver);
    report("v5-referrer", document.referrer || "empty");
    report("v5-visibility", document.visibilityState);
    report("v5-completed", "yes");
  </script>
</body>
</html>
